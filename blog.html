		<h1>Sententiæ</h1>

<footer>
			<p>
				<span data-i18n="footer"></span>・<code id="count">2026</code>
			</p>
		</footer>
		<script>
			const counter = document.getElementById("count");

			const start = Date.now();

			const animation = () =>
			{
				const now = Date.now();
				const dt = now - start;
				const prog = dt / 5_000;

				const simulated_year = 2026 * Math.sin(Math.PI / 2 * prog);
				
				counter.textContent =
					Math.floor(simulated_year)
						.toString()
						.padStart(4, "0");

				if (dt < 5_000)
				{
					requestAnimationFrame(animation);
				} else
				{
					counter.textContent = "2026";
				}
			}

			requestAnimationFrame(animation);
		</script>
	</body>
